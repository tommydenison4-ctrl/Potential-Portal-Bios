<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Player Books</title>
<style>
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#1e293b;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .box{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;width:min(92vw,340px)}
  h1{font-size:19px;margin:0 0 4px}
  p{color:#64748b;font-size:13.5px;margin:0 0 16px}
  label{display:block;font-size:12.5px;font-weight:600;color:#64748b;margin-bottom:4px}
  input{width:100%;box-sizing:border-box;font:inherit;padding:9px 10px;border:1px solid #e2e8f0;border-radius:7px}
  button{width:100%;margin-top:14px;font:inherit;font-weight:600;background:#334155;color:#fff;border:0;border-radius:7px;padding:10px;cursor:pointer}
  .err{color:#b91c1c;font-size:13.5px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>Player Books</h1>
    <p>This library is private. Enter the password to continue.</p>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({password: document.getElementById('pw').value})
      });
      if (r.ok) { location.href = '/'; }
      else { err.textContent = 'Incorrect password.'; }
    } catch (_) { err.textContent = 'Something went wrong. Try again.'; }
  });
</script>
</body>
</html>
